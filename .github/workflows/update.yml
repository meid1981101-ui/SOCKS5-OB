name: Update SOCKS5 Proxy List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update proxies
        run: |
          curl -s "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt" > all.txt
          curl -s "https://api.openproxylist.xyz/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/refs/heads/master/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ALIILAPRO/Proxy/main/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ProxyScraper/ProxyScraper/refs/heads/main/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/Vann-Dev/proxy-list/main/proxies/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/vmheaven/VMHeaven-Free-Proxy-Updated/main/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/iplocate/free-proxy-list/refs/heads/main/protocols/socks5.txt" >> all.txt
          curl -s "https://www.socks-proxy.net/" >> all.txt
          curl -s "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=10000&country=all" >> all.txt
          curl -s "https://raw.githubusercontent.com/proxygenerator1/ProxyGenerator/refs/heads/main/Stable/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/Thordata/awesome-free-proxy-list/refs/heads/main/proxies/socks5.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/handeveloper1/DailyProxy---Auto-Update-List/refs/heads/main/Proxies-Ercin/socks5.txt" >> all.txt
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{2,5}' all.txt | sort -u -o all.txt
          

      - name: Commit and push updated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          date -u > timestamp.txt
          git add all.txt timestamp.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HTTP proxy list and keepalive timestamp" && git push)
